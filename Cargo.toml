[package]
name = "hica-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native launcher for Hica applications"
license = "MIT"
repository = "https://github.com/cladam/hica-launcher"
categories = ["gui", "development-tools"]

[dependencies]
anyhow = "1"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["json", "rustls-no-provider", "_ring", "platform-verifier"] }
